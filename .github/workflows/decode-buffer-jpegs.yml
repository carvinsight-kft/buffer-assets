name: decode-buffer-jpegs
on:
  push:
    paths:
      - "b64/**"
      - ".github/workflows/decode-buffer-jpegs.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode b64 parts to img/*.jpg
        run: |
          python3 - <<'PY'
          import base64, pathlib
          from collections import defaultdict
          src = pathlib.Path('b64')
          dst = pathlib.Path('img')
          dst.mkdir(exist_ok=True)
          groups = defaultdict(list)
          for p in sorted(src.iterdir()):
              if not p.is_file():
                  continue
              name = p.name
              if '.p' in name and name.rsplit('.p',1)[-1].isdigit():
                  stem = name.rsplit('.p',1)[0]
                  groups[stem].append(p)
              elif name.endswith('.b64'):
                  groups[name[:-4]].append(p)
          for stem, parts in groups.items():
              blob = ''.join(x.read_text().strip() for x in parts)
              data = base64.b64decode(blob)
              out = dst / stem
              out.write_bytes(data)
              print(stem, len(parts), 'parts', len(data), 'bytes')
          PY
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img
          if git diff --cached --quiet; then
            echo "no image changes"
          else
            git commit -m "Add Buffer-ready JPEGs decoded from b64"
            git push
          fi
